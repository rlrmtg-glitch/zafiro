name: Build Zafiro debug APK

on:
  push:
    branches:
      - security/governed-assistant-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zafiro-debug-build
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build unsigned-source debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0" "platform-tools"

      - name: Verify Gradle wrapper JAR integrity
        run: |
          set -euo pipefail
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          printf '%s  %s\n' \
            'b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13' \
            'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check

      - name: Verify Gradle wrapper distribution
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Run Kotlin and Python verification gates
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :agent-runtime:testDebugUnitTest \
            :app:testDebugUnitTest \
            :agent-runtime:check \
            2>&1 | tee build-verification.log

      - name: Assemble debug APK without device ADB tasks
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug -x :app:adbForward

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zafiro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload verification logs and checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zafiro-verification-evidence
          path: |
            build-verification.log
            apk-sha256.txt
          if-no-files-found: warn
          retention-days: 7
