name: Build Zafiro debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zafiro-debug-build
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build unsigned-source debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0" "platform-tools"

      - name: Verify Gradle wrapper
        run: |
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Assemble debug APK without device ADB tasks
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug -x :app:adbForward

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zafiro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
